# Cada día descarga los datos de INE, Eurostat y BCE, los publica como archivo descargable
# (pestaña «Actions» → última ejecución → «Artifacts») y actualiza la web pública en GitHub Pages:
# https://osquihdts-design.github.io/observatorio-economico/
# También se ejecuta al subir cambios a main (para publicar el código nuevo) y se puede lanzar a mano.
name: Actualizar datos y web

on:
  schedule:
    - cron: "30 7 * * *"  # todos los días a las 07:30 UTC (después de las publicaciones de la mañana)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest
      - name: Descargar datos
        # Si alguna fuente falla, el paso sale en rojo para avisar, pero la web se publica con lo que haya.
        id: datos
        continue-on-error: true
        run: python scripts/actualizar_datos.py
      - name: Verificar los datos con las fuentes oficiales
        # Pide a cada organismo su último dato por una consulta independiente y lo compara con el panel.
        continue-on-error: true
        run: python scripts/verificar_datos.py
      - name: Ejemplo de laboratorio (comprueba el motor econométrico con datos reales)
        continue-on-error: true
        run: python scripts/ejemplo_laboratorio.py
      - name: Publicar los datos como archivo
        uses: actions/upload-artifact@v7
        with:
          name: datos-observatorio
          path: |
            data/processed/observatorio.sqlite
            data/processed/observaciones.csv
            data/processed/ejemplo_curva_phillips.xlsx
          if-no-files-found: warn
          retention-days: 30
      - name: Generar la web pública
        run: python scripts/publicar_web.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Avisar si falló la descarga
        if: steps.datos.outcome == 'failure'
        run: |
          echo "::warning::Alguna fuente falló al descargar: la web se ha publicado con los datos disponibles."

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
